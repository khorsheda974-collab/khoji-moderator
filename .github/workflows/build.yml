name: build-manual-final
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK Manually
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          yes | sdkmanager --install "platforms;android-33" "build-tools;33.0.1" --licenses || true
          sdkmanager --install "platforms;android-33" "build-tools;33.0.1"
          
          rm -rf app build
          mkdir -p app/src/main/java/com/aisupplier/bot
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p build/obj build/apk

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">Real AI Bot</string></resources>
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.aisupplier.bot">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="Real AI Bot">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <service android:name=".AutoReplyService" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true">
                <intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter>
              </service>
            </application>
          </manifest>
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:padding="16dp">
            <EditText android:id="@+id/apiKey" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Gemini API Key"/>
            <EditText android:id="@+id/biz" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Business Info" android:minLines="3"/>
            <Button android:id="@+id/save" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Save"/>
          </LinearLayout>
          EOF

          cat > app/src/main/java/com/aisupplier/bot/MainActivity.java << 'EOF'
          package com.aisupplier.bot;
          import android.app.Activity; import android.content.Intent; import android.content.SharedPreferences; import android.os.Bundle; import android.widget.*;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout lay = new LinearLayout(this); lay.setOrientation(LinearLayout.VERTICAL); lay.setPadding(32,32,32,32);
                  EditText api = new EditText(this); api.setHint("Gemini API Key");
                  EditText biz = new EditText(this); biz.setHint("Business Info");
                  Button btn = new Button(this); btn.setText("Save & Enable");
                  lay.addView(api); lay.addView(biz); lay.addView(btn);
                  setContentView(lay);
                  SharedPreferences pref=getSharedPreferences("bot", MODE_PRIVATE);
                  api.setText(pref.getString("api","")); biz.setText(pref.getString("biz",""));
                  btn.setOnClickListener(v->{ pref.edit().putString("api", api.getText().toString()).putString("biz", biz.getText().toString()).apply(); startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS")); Toast.makeText(this,"Saved",Toast.LENGTH_LONG).show(); });
              }
          }
          EOF

          cat > app/src/main/java/com/aisupplier/bot/AutoReplyService.java << 'EOF'
          package com.aisupplier.bot;
          import android.content.Intent; import android.content.SharedPreferences; import android.os.Bundle; import android.service.notification.NotificationListenerService; import android.service.notification.StatusBarNotification;
          import org.json.*; import java.io.*; import java.net.*;
          public class AutoReplyService extends NotificationListenerService {
              public void onNotificationPosted(StatusBarNotification sbn) {
                  if(!sbn.getPackageName().contains("whatsapp")) return;
                  SharedPreferences pref=getSharedPreferences("bot", MODE_PRIVATE);
                  String apiKey=pref.getString("api",""); if(apiKey.isEmpty()) return;
                  String text=sbn.getNotification().extras.getCharSequence("android.text")!=null?sbn.getNotification().extras.getCharSequence("android.text").toString():""; if(text.isEmpty()) return;
                  String biz=pref.getString("biz","online shop");
                  new Thread(()->{
                      try{
                          String prompt="You are AI for: "+biz+". Customer: "+text+". Reply short Bangla, add [AI Bot]";
                          JSONObject j=new JSONObject(); j.put("contents", new JSONArray().put(new JSONObject().put("parts", new JSONArray().put(new JSONObject().put("text", prompt)))));
                          URL url=new URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+apiKey);
                          HttpURLConnection conn=(HttpURLConnection)url.openConnection(); conn.setRequestMethod("POST"); conn.setRequestProperty("Content-Type","application/json"); conn.setDoOutput(true);
                          OutputStream os=conn.getOutputStream(); os.write(j.toString().getBytes()); os.close();
                          BufferedReader br=new BufferedReader(new InputStreamReader(conn.getInputStream())); StringBuilder sb=new StringBuilder(); String l; while((l=br.readLine())!=null) sb.append(l);
                          String reply=new JSONObject(sb.toString()).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text");
                          android.app.Notification.Action act=sbn.getNotification().actions[sbn.getNotification().actions.length-1];
                          Intent intent=new Intent(); Bundle bundle=new Bundle(); bundle.putCharSequence(act.getRemoteInputs()[0].getResultKey(), reply);
                          android.app.RemoteInput.addResultsToIntent(act.getRemoteInputs(), intent, bundle); act.actionIntent.send(this,0,intent);
                      }catch(Exception e){}
                  }).start();
              }
          }
          EOF

          # Compile
          ANDROID_JAR=$ANDROID_HOME/platforms/android-33/android.jar
          BUILD_TOOLS=$ANDROID_HOME/build-tools/33.0.1
          
          javac -classpath $ANDROID_JAR -d build/obj $(find app/src/main/java -name "*.java")
          
          $BUILD_TOOLS/d8 --output build/ build/obj/com/aisupplier/bot/*.class
          
          $BUILD_TOOLS/aapt2 compile app/src/main/res/values/strings.xml -o build/
          $BUILD_TOOLS/aapt2 compile app/src/main/res/layout/activity_main.xml -o build/ || true
          
          $BUILD_TOOLS/aapt2 link -I $ANDROID_JAR --manifest app/src/main/AndroidManifest.xml -o build/apk/unsigned.apk build/*.flat --auto-add-overlay
          
          mkdir -p build/apk/classes
          cp -r build/classes.dex build/apk/ || cp build/classes.dex build/apk/
          cd build/apk && $BUILD_TOOLS/aapt2 add unsigned.apk classes.dex || zip -u unsigned.apk classes.dex
          cd ../..
          
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out build/apk/Real-AI-Bot-FINAL.apk build/apk/unsigned.apk
          
          ls -lh build/apk/*.apk
          $BUILD_TOOLS/aapt2 dump badging build/apk/Real-AI-Bot-FINAL.apk || true

      - uses: actions/upload-artifact@v4
        with:
          name: Real-AI-Bot-Working
          path: build/apk/*.apk
