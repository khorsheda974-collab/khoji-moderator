name: build-apk
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Make APK
        run: |
          mkdir -p app/src/main/java/com/aisupplier/bot
          mkdir -p app/src/main/res/layout
          echo "include ':app'" > settings.gradle
          echo "buildscript{repositories{google();mavenCentral()} dependencies{classpath 'com.android.tools.build:gradle:8.2.2'}} allprojects{repositories{google();mavenCentral()}}" > build.gradle
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android{compileSdk 34; defaultConfig{applicationId "com.aisupplier.bot"; minSdk 24; targetSdk 34}}
          dependencies{implementation 'com.squareup.okhttp3:okhttp:4.12.0'}
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="AI Bot"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><service android:name=".AutoReplyService" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true"><intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter></service></application></manifest>
          EOF
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:padding="16dp" android:layout_width="match_parent" android:layout_height="match_parent"><EditText android:id="@+id/apiKey" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Gemini API Key"/><EditText android:id="@+id/biz" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="ব্যবসার তথ্য" android:minLines="3"/><Button android:id="@+id/save" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Save"/></LinearLayout>
          EOF
          cat > app/src/main/java/com/aisupplier/bot/MainActivity.kt << 'EOF'
          package com.aisupplier.bot
          import android.content.Intent
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              setContentView(R.layout.activity_main)
              val api = findViewById<EditText>(R.id.apiKey)
              val biz = findViewById<EditText>(R.id.biz)
              val btn = findViewById<Button>(R.id.save)
              val pref = getSharedPreferences("bot", MODE_PRIVATE)
              api.setText(pref.getString("api","")); biz.setText(pref.getString("biz",""))
              btn.setOnClickListener {
                pref.edit().putString("api", api.text.toString()).putString("biz", biz.text.toString()).apply()
                startActivity(Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"))
                Toast.makeText(this, "Save হয়েছে", Toast.LENGTH_LONG).show()
              }
            }
          }
          EOF
          cat > app/src/main/java/com/aisupplier/bot/AutoReplyService.kt << 'EOF'
          package com.aisupplier.bot
          import android.content.Context
          import android.os.Bundle
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import okhttp3.*
          import okhttp3.MediaType.Companion.toMediaType
          import org.json.JSONObject
          class AutoReplyService : NotificationListenerService() {
            private val client = OkHttpClient()
            override fun onNotificationPosted(sbn: StatusBarNotification) {
              if (sbn.packageName != "com.whatsapp" && sbn.packageName != "com.whatsapp.w4b") return
              val pref = getSharedPreferences("bot", Context.MODE_PRIVATE)
              val apiKey = pref.getString("api","") ?: ""; if (apiKey.isEmpty()) return
              val text = sbn.notification.extras.getCharSequence("android.text")?.toString() ?: ""; if (text.isEmpty()) return
              val biz = pref.getString("biz","online shop")
              val prompt = "You are AI for: $biz. Customer: $text. Reply in Bangla short, add [AI Bot] at end."
              val json = JSONObject().put("contents", org.json.JSONArray().put(JSONObject().put("parts", org.json.JSONArray().put(JSONObject().put("text", prompt)))))
              val req = Request.Builder().url("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$apiKey").post(RequestBody.create("application/json".toMediaType(), json.toString())).build()
              client.newCall(req).enqueue(object: Callback {
                override fun onFailure(call: Call, e: java.io.IOException) {}
                override fun onResponse(call: Call, response: Response) {
                  try {
                    val reply = JSONObject(response.body?.string()?:"").getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")
                    val act = sbn.notification.actions?.lastOrNull() ?: return
                    val intent = android.content.Intent(); val bundle = Bundle()
                    bundle.putCharSequence(act.remoteInputs[0].resultKey, reply)
                    android.app.RemoteInput.addResultsToIntent(act.remoteInputs, intent, bundle)
                    act.actionIntent.send(this@AutoReplyService, 0, intent)
                  } catch (e: Exception) {}
                }
              })
            }
          }
          EOF
          chmod +x ./gradlew 2>/dev/null || true
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Real-AI-APK
          path: app/build/outputs/apk/debug/*.apk
