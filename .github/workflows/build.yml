name: build-no-lib-final
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK No External Libs
        run: |
          rm -rf app build .gradle
          mkdir -p app/src/main/java/com/aisupplier/bot
          mkdir -p app/src/main/res/values
          
          echo "include ':app'" > settings.gradle
          
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
              compileSdkVersion 33
              buildToolsVersion "33.0.1"
              defaultConfig {
                  applicationId "com.aisupplier.bot"
                  minSdkVersion 24
                  targetSdkVersion 33
                  versionCode 15
                  versionName "15.0"
              }
          }
          EOF
          
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.aisupplier.bot">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="Real AI Bot">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <service android:name=".AutoReplyService" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true">
                <intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter>
              </service>
            </application>
          </manifest>
          EOF
          
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">Real AI Bot</string></resources>
          EOF
          
          cat > app/src/main/java/com/aisupplier/bot/MainActivity.java << 'EOF'
          package com.aisupplier.bot;
          import android.app.Activity; import android.content.Intent; import android.content.SharedPreferences; import android.os.Bundle; import android.widget.*;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout lay = new LinearLayout(this);
                  lay.setOrientation(LinearLayout.VERTICAL);
                  lay.setPadding(50,50,50,50);
                  EditText api = new EditText(this); api.setHint("Gemini API Key - paste here");
                  EditText biz = new EditText(this); biz.setHint("Business Info - ex: Ami 3pc sell kori, price 1200");
                  biz.setMinLines(3);
                  Button btn = new Button(this); btn.setText("Save & Enable Notification Access");
                  lay.addView(api); lay.addView(biz); lay.addView(btn);
                  setContentView(lay);
                  SharedPreferences pref=getSharedPreferences("bot", MODE_PRIVATE);
                  api.setText(pref.getString("api","")); biz.setText(pref.getString("biz",""));
                  btn.setOnClickListener(v->{
                      pref.edit().putString("api", api.getText().toString()).putString("biz", biz.getText().toString()).apply();
                      startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
                      Toast.makeText(this,"Saved! Now enable Real AI Bot",Toast.LENGTH_LONG).show();
                  });
              }
          }
          EOF
          
          cat > app/src/main/java/com/aisupplier/bot/AutoReplyService.java << 'EOF'
          package com.aisupplier.bot;
          import android.content.Intent; import android.content.SharedPreferences; import android.os.Bundle; import android.service.notification.NotificationListenerService; import android.service.notification.StatusBarNotification;
          import org.json.*; import java.io.*; import java.net.*;
          public class AutoReplyService extends NotificationListenerService {
              public void onNotificationPosted(StatusBarNotification sbn) {
                  if(!sbn.getPackageName().contains("whatsapp")) return;
                  SharedPreferences pref=getSharedPreferences("bot", MODE_PRIVATE);
                  String apiKey=pref.getString("api",""); if(apiKey.isEmpty()) return;
                  CharSequence cs=sbn.getNotification().extras.getCharSequence("android.text");
                  String text=cs!=null?cs.toString():""; if(text.isEmpty() || text.contains("[AI Bot]")) return;
                  String biz=pref.getString("biz","online shop");
                  new Thread(()->{
                      try{
                          String prompt="You are AI assistant for: "+biz+". Customer says: "+text+". Reply short friendly Bangla. Add [AI Bot] at end.";
                          JSONObject j=new JSONObject(); j.put("contents", new JSONArray().put(new JSONObject().put("parts", new JSONArray().put(new JSONObject().put("text", prompt)))));
                          URL url=new URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+apiKey);
                          HttpURLConnection conn=(HttpURLConnection)url.openConnection(); conn.setRequestMethod("POST"); conn.setRequestProperty("Content-Type","application/json"); conn.setDoOutput(true);
                          OutputStream os=conn.getOutputStream(); os.write(j.toString().getBytes()); os.close();
                          BufferedReader br=new BufferedReader(new InputStreamReader(conn.getInputStream())); StringBuilder sb=new StringBuilder(); String line; while((line=br.readLine())!=null) sb.append(line);
                          String reply=new JSONObject(sb.toString()).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text");
                          android.app.Notification.Action act=sbn.getNotification().actions[sbn.getNotification().actions.length-1];
                          Intent intent=new Intent(); Bundle bundle=new Bundle(); bundle.putCharSequence(act.getRemoteInputs()[0].getResultKey(), reply);
                          android.app.RemoteInput.addResultsToIntent(act.getRemoteInputs(), intent, bundle); act.actionIntent.send(this,0,intent);
                      }catch(Exception e){}
                  }).start();
              }
          }
          EOF
          
          wget -q https://services.gradle.org/distributions/gradle-7.6.3-bin.zip
          unzip -q gradle-7.6.3-bin.zip
          ./gradle-7.6.3/bin/gradle :app:assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: Real-AI-APK-NoLib-Working
          path: app/build/outputs/apk/debug/*.apk
