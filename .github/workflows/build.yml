name: build-fixed-import
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" || true
          rm -rf app build .gradle
          mkdir -p app/src/main/java/com/aisupplier/bot
          mkdir -p app/src/main/res/layout
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
              namespace 'com.aisupplier.bot'
              compileSdk 34
              defaultConfig { applicationId "com.aisupplier.bot"; minSdk 24; targetSdk 34; versionCode 11; versionName "11.0" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="Real AI Bot"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><service android:name=".AutoReplyService" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true"><intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter></service></application></manifest>
          EOF
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:padding="16dp"><EditText android:id="@+id/apiKey" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Gemini API Key"/><EditText android:id="@+id/biz" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Business Info" android:minLines="3"/><Button android:id="@+id/save" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Save"/></LinearLayout>
          EOF
          cat > app/src/main/java/com/aisupplier/bot/MainActivity.java << 'EOF'
          package com.aisupplier.bot;
          import android.app.Activity; import android.content.Intent; import android.content.SharedPreferences; import android.os.Bundle; import android.widget.*;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b) {
                  super.onCreate(b); setContentView(R.layout.activity_main);
                  EditText api=findViewById(R.id.apiKey); EditText biz=findViewById(R.id.biz); Button btn=findViewById(R.id.save);
                  SharedPreferences pref=getSharedPreferences("bot", MODE_PRIVATE);
                  api.setText(pref.getString("api","")); biz.setText(pref.getString("biz",""));
                  btn.setOnClickListener(v->{ pref.edit().putString("api", api.getText().toString()).putString("biz", biz.getText().toString()).apply(); startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS")); Toast.makeText(this,"Saved",Toast.LENGTH_LONG).show(); });
              }
          }
          EOF
          cat > app/src/main/java/com/aisupplier/bot/AutoReplyService.java << 'EOF'
          package com.aisupplier.bot;
          import android.content.Intent; import android.content.SharedPreferences; import android.os.Bundle; import android.service.notification.NotificationListenerService; import android.service.notification.StatusBarNotification;
          import org.json.*; import java.io.*; import java.net.*;
          public class AutoReplyService extends NotificationListenerService {
              public void onNotificationPosted(StatusBarNotification sbn) {
                  if(!sbn.getPackageName().equals("com.whatsapp") && !sbn.getPackageName().equals("com.whatsapp.w4b")) return;
                  SharedPreferences pref=getSharedPreferences("bot", MODE_PRIVATE);
                  String apiKey=pref.getString("api",""); if(apiKey.isEmpty()) return;
                  String text=sbn.getNotification().extras.getCharSequence("android.text")!=null?sbn.getNotification().extras.getCharSequence("android.text").toString():""; if(text.isEmpty()) return;
                  String biz=pref.getString("biz","online shop");
                  new Thread(()->{
                      try{
                          String prompt="You are AI for: "+biz+". Customer: "+text+". Reply short Bangla, add [AI Bot].";
                          JSONObject j=new JSONObject(); j.put("contents", new JSONArray().put(new JSONObject().put("parts", new JSONArray().put(new JSONObject().put("text", prompt)))));
                          URL url=new URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+apiKey);
                          HttpURLConnection conn=(HttpURLConnection)url.openConnection(); conn.setRequestMethod("POST"); conn.setRequestProperty("Content-Type","application/json"); conn.setDoOutput(true);
                          OutputStream os=conn.getOutputStream(); os.write(j.toString().getBytes()); os.close();
                          BufferedReader br=new BufferedReader(new InputStreamReader(conn.getInputStream())); StringBuilder sb=new StringBuilder(); String line; while((line=br.readLine())!=null) sb.append(line);
                          String reply=new JSONObject(sb.toString()).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text");
                          android.app.Notification.Action act=sbn.getNotification().actions[sbn.getNotification().actions.length-1];
                          Intent intent=new Intent(); Bundle bundle=new Bundle(); bundle.putCharSequence(act.getRemoteInputs()[0].getResultKey(), reply);
                          android.app.RemoteInput.addResultsToIntent(act.getRemoteInputs(), intent, bundle); act.actionIntent.send(this,0,intent);
                      }catch(Exception e){}
                  }).start();
              }
          }
          EOF
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip; unzip -q gradle-8.0-bin.zip
          ./gradle-8.0/bin/gradle :app:assembleDebug --no-daemon --stacktrace
          find . -name "*.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Real-AI-APK
          path: "**/*.apk"
