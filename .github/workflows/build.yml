name: build-final-fixed-jar
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Fixed APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          echo "=== Installing platforms ==="
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-33" "platforms;android-30" "build-tools;30.0.3" || true
          
          AAPT2=$(find $ANDROID_HOME/build-tools -name aapt2 | sort -V | tail -n1)
          D8=$(find $ANDROID_HOME/build-tools -name d8 | sort -V | tail -n1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n1)
          ANDROID_JAR=$(find $ANDROID_HOME/platforms -name android.jar | grep "android-33" | head -n1)
          if [ -z "$ANDROID_JAR" ]; then ANDROID_JAR=$(find $ANDROID_HOME/platforms -name android.jar | sort -V | tail -n1); fi
          echo "AAPT2: $AAPT2"
          echo "ANDROID_JAR: $ANDROID_JAR"
          ls $ANDROID_HOME/platforms/
          
          rm -rf build app
          mkdir -p app/src/main/java/com/aisupplier/bot
          mkdir -p app/src/main/res/values
          mkdir -p build/obj build/apk

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.aisupplier.bot.fixed">
            <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="30"/>
            <uses-permission android:name="android.permission.INTERNET"/>
           
