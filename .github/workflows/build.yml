name: build-nolib-compatible-final
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Build Compatible NoLib APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/build-tools/30.0.3:$PATH
          sdkmanager --install "platforms;android-30" "build-tools;30.0.3" || true
          rm -rf build app
          mkdir -p app/src/main/java/com/aisupplier/bot
          mkdir -p app/src/main/res/values
          mkdir -p build/gen build/obj build/apk
          ANDROID_JAR=$ANDROID_HOME/platforms/android-30/android.jar
          BUILD_TOOLS=$ANDROID_HOME/build-tools/30.0.3

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.aisupplier.bot.compat">
            <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="30"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="Real AI Bot">
              <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              <service android:name=".AutoReplyService" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true"><intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter></service>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">Real AI Bot</string></resources>
          EOF
          cat > app/src/main/java/com/aisupplier/bot/MainActivity.java << 'EOF'
          package com.aisupplier.bot;
          import android.app.Activity; import android.content.Intent; import android.content.SharedPreferences; import android.os.Bundle; import android.widget.*;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout lay = new LinearLayout(this); lay.setOrientation(LinearLayout.VERTICAL); lay.setPadding(50,50,50,50);
                  EditText api = new EditText(this); api.setHint("Gemini API Key");
                  EditText biz = new EditText(this); biz.setHint("Business Info ex: 3pc 1200tk"); biz.setMinLines(3);
                  Button btn = new Button(this); btn.setText("Save & Enable");
                  lay.addView(api); lay.addView(biz); lay.addView(btn); setContentView(lay);
                  SharedPreferences pref=getSharedPreferences("bot", MODE_PRIVATE);
                  api.setText(pref.getString("api","")); biz.setText(pref.getString("biz",""));
                  btn.setOnClickListener(v->{ pref.edit().putString("api", api.getText().toString()).putString("biz", biz.getText().toString()).apply(); startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS")); Toast.makeText(this,"Saved! Enable Real AI Bot",Toast.LENGTH_LONG).show(); });
              }
          }
          EOF
          cat > app/src/main/java/com/aisupplier/bot/AutoReplyService.java << 'EOF'
          package com.aisupplier.bot;
          import android.content.Intent; import android.content.SharedPreferences; import android.os.Bundle; import android.service.notification.NotificationListenerService; import android.service.notification.StatusBarNotification;
          import org.json.*; import java.io.*; import java.net.*;
          public class AutoReplyService extends NotificationListenerService {
              public void onNotificationPosted(StatusBarNotification sbn) {
                  if(!sbn.getPackageName().contains("whatsapp")) return;
                  SharedPreferences pref=getSharedPreferences("bot", MODE_PRIVATE);
                  String apiKey=pref.getString("api",""); if(apiKey.isEmpty()) return;
                  String text=sbn.getNotification().extras.getCharSequence("android.text")!=null?sbn.getNotification().extras.getCharSequence("android.text").toString():""; if(text.isEmpty() || text.contains("[AI Bot]")) return;
                  String biz=pref.getString("biz","online shop");
                  new Thread(()->{ try{
                      String prompt="You are AI for: "+biz+". Customer: "+text+". Reply short Bangla, add [AI Bot]";
                      JSONObject j=new JSONObject(); j.put("contents", new JSONArray().put(new JSONObject().put("parts", new JSONArray().put(new JSONObject().put("text", prompt)))));
                      URL url=new URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+apiKey);
                      HttpURLConnection conn=(HttpURLConnection)url.openConnection(); conn.setRequestMethod("POST"); conn.setRequestProperty("Content-Type","application/json"); conn.setDoOutput(true);
                      OutputStream os=conn.getOutputStream(); os.write(j.toString().getBytes()); os.close();
                      BufferedReader br=new BufferedReader(new InputStreamReader(conn.getInputStream())); StringBuilder sb=new StringBuilder(); String l; while((l=br.readLine())!=null) sb.append(l);
                      String reply=new JSONObject(sb.toString()).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text");
                      android.app.Notification.Action act=sbn.getNotification().actions[sbn.getNotification().actions.length-1];
                      Intent intent=new Intent(); Bundle bundle=new Bundle(); bundle.putCharSequence(act.getRemoteInputs()[0].getResultKey(), reply);
                      android.app.RemoteInput.addResultsToIntent(act.getRemoteInputs(), intent, bundle); act.actionIntent.send(this,0,intent);
                  }catch(Exception e){} }).start();
              }
          }
          EOF

          echo "=== BUILD RES ==="
          $BUILD_TOOLS/aapt2 compile --dir app/src/main/res -o build/res.zip
          $BUILD_TOOLS/aapt2 link -I $ANDROID_JAR --manifest app/src/main/AndroidManifest.xml --min-sdk-version 21 --target-sdk-version 30 -o build/apk/base.apk build/res.zip --auto-add-overlay

          echo "=== BUILD DEX ==="
          javac -source 8 -target 8 -classpath $ANDROID_JAR -d build/obj $(find app/src/main/java -name "*.java")
          $BUILD_TOOLS/d8 --min-api 21 --output build/apk/ build/obj/com/aisupplier/bot/*.class

          echo "=== ADD DEX & SIGN ==="
          cd build/apk && zip -u base.apk classes.dex && cd ../..
          $BUILD_TOOLS/zipalign -f 4 build/apk/base.apk build/apk/unsigned.apk
          keytool -genkey -v -keystore build/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug" -noprompt
          $BUILD_TOOLS/apksigner sign --v1-signing-enabled true --v2-signing-enabled true --ks build/debug.keystore --ks-pass pass:android --key-pass pass:android --out build/apk/Real-AI-Bot-COMPAT.apk build/apk/unsigned.apk
          $BUILD_TOOLS/apksigner verify --verbose build/apk/Real-AI-Bot-COMPAT.apk
          ls -lh build/apk/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Real-AI-Bot-COMPAT-FINAL
          path: build/apk/Real-AI-Bot-COMPAT.apk
