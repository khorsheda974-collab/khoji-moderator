name: build-python-fix
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build with Python Writer
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-33" || true
          AAPT2=$(find $ANDROID_HOME/build-tools -name aapt2 | sort -V | tail -n1)
          D8=$(find $ANDROID_HOME/build-tools -name d8 | sort -V | tail -n1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n1)
          ANDROID_JAR=$(find $ANDROID_HOME/platforms -name android.jar | sort -V | tail -n1)
          rm -rf build app
          mkdir -p app/src/main/java/com/aisupplier/bot/nocrash app/src/main/res/layout app/src/main/res/values build/gen build/obj build/apk
          python3 << 'PY'
          import os, pathlib
          pathlib.Path("app/src/main/AndroidManifest.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.aisupplier.bot.nocrash">
            <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="30"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="Real AI Bot" android:theme="@android:style/Theme.Light">
              <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              <service android:name=".AutoReplyService" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true"><intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter></service>
            </application>
          </manifest>''')
          pathlib.Path("app/src/main/res/values/strings.xml").write_text('''<resources><string name="app_name">Real AI Bot</string></resources>''')
          pathlib.Path("app/src/main/res/layout/activity_main.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:padding="16dp">
              <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Real AI Bot Setup" android:textSize="20sp"/>
              <EditText android:id="@+id/apiKey" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Gemini API Key"/>
              <EditText android:id="@+id/biz" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Business Info" android:minLines="3"/>
              <Button android:id="@+id/save" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Save"/>
          </LinearLayout>''')
          pathlib.Path("app/src/main/java/com/aisupplier/bot/nocrash/MainActivity.java").write_text('''package com.aisupplier.bot.nocrash;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.widget.*;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  EditText api=findViewById(R.id.apiKey);
                  EditText biz=findViewById(R.id.biz);
                  Button btn=findViewById(R.id.save);
                  SharedPreferences pref=getSharedPreferences("bot", MODE_PRIVATE);
                  api.setText(pref.getString("api",""));
                  biz.setText(pref.getString("biz",""));
                  btn.setOnClickListener(v->{
                      pref.edit().putString("api", api.getText().toString()).putString("biz", biz.getText().toString()).apply();
                      Toast.makeText(this,"Saved",Toast.LENGTH_LONG).show();
                      startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS"));
                  });
              }
          }''')
          pathlib.Path("app/src/main/java/com/aisupplier/bot/nocrash/AutoReplyService.java").write_text('''package com.aisupplier.bot.nocrash;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import org.json.*;
          import java.io.*;
          import java.net.*;
          public class AutoReplyService extends NotificationListenerService {
              public void onNotificationPosted(StatusBarNotification sbn) {
                  try{
                  if(!sbn.getPackageName().contains("whatsapp")) return;
                  Object txtObj=sbn.getNotification().extras.getCharSequence("android.text");
                  if(txtObj==null) return;
                  String text=txtObj.toString();
                  if(text.isEmpty() || text.contains("[AI Bot]")) return;
                  SharedPreferences pref=getSharedPreferences("bot", MODE_PRIVATE);
                  String apiKey=pref.getString("api","");
                  if(apiKey.isEmpty()) return;
                  String biz=pref.getString("biz","online shop");
                  new Thread(()->{ try{
                      String prompt="You are AI for "+biz+". Customer says "+text+". Reply short Bangla friendly add [AI Bot]";
                      JSONObject j=new JSONObject();
                      j.put("contents", new JSONArray().put(new JSONObject().put("parts", new JSONArray().put(new JSONObject().put("text", prompt)))));
                      URL url=new URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+apiKey);
                      HttpURLConnection conn=(HttpURLConnection)url.openConnection();
                      conn.setRequestMethod("POST");
                      conn.setRequestProperty("Content-Type","application/json");
                      conn.setDoOutput(true);
                      OutputStream os=conn.getOutputStream();
                      os.write(j.toString().getBytes());
                      os.close();
                      if(conn.getResponseCode()!=200) return;
                      BufferedReader br=new BufferedReader(new InputStreamReader(conn.getInputStream()));
                      StringBuilder sb=new StringBuilder(); String l;
                      while((l=br.readLine())!=null) sb.append(l);
                      String reply=new JSONObject(sb.toString()).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text");
                      android.app.Notification.Action act=sbn.getNotification().actions[sbn.getNotification().actions.length-1];
                      Intent intent=new Intent();
                      Bundle bundle=new Bundle();
                      bundle.putCharSequence(act.getRemoteInputs()[0].getResultKey(), reply);
                      android.app.RemoteInput.addResultsToIntent(act.getRemoteInputs(), intent, bundle);
                      act.actionIntent.send(this,0,intent);
                  }catch(Exception e){} }).start();
                  }catch(Exception e){}
              }
          }''')
          PY
          echo "Files created"
          $AAPT2 compile --dir app/src/main/res -o build/res.zip
          $AAPT2 link -I $ANDROID_JAR --manifest app/src/main/AndroidManifest.xml --java build/gen --min-sdk-version 21 --target-sdk-version 30 -o build/apk/base.apk build/res.zip --auto-add-overlay
          javac -source 8 -target 8 -classpath $ANDROID_JAR -d build/obj build/gen/com/aisupplier/bot/nocrash/R.java $(find app/src/main/java -name "*.java")
          $D8 --min-api 21 --output build/apk/ build/obj/com/aisupplier/bot/nocrash/*.class
          cd build/apk && zip -u base.apk classes.dex && cd ../..
          $ZIPALIGN -f 4 build/apk/base.apk build/apk/app.apk
          keytool -genkey -v -keystore build/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug" -noprompt
          $APKSIGNER sign --ks build/debug.keystore --ks-pass pass:android --key-pass pass:android --out build/final.apk build/apk/app.apk
          ls -lh build/final.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Real-AI-Bot-Fixed
          path: build/final.apk
